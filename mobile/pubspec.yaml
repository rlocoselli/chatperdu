name: chat_perdu
description: Réseau gratuit d'entraide pour chats perdus.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  google_mobile_ads: ^6.0.0
  http: ^1.4.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/chat-perdu-hero.png"
  min_sdk_android: 21
  adaptive_icon_background: "#173c35"
  adaptive_icon_foreground: "assets/chat-perdu-hero.png"
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/chat-perdu-hero.png
